{% extends "base.html" %}{% block content %}<div class="form-card"><h1 class="h3 mb-3">{{ 'Update Book' if book else 'Add New Book' }}</h1>
<form method="post"><div class="mb-3"><label class="form-label">Book title</label><input class="form-control" name="title" value="{{ book.title if book else '' }}" required></div>
<div class="mb-3"><label class="form-label">Author</label><input class="form-control" name="author" value="{{ book.author if book else '' }}" required></div>
<div class="mb-3"><label class="form-label">ISBN</label><input class="form-control" name="isbn" value="{{ book.isbn if book else '' }}"></div>
<div class="mb-3"><label class="form-label">Total copies</label><input class="form-control" type="number" min="1" name="copies" value="{{ book.total_copies if book else 1 }}" required></div>
<button class="btn btn-primary">Save Book</button> <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Cancel</a></form></div>{% endblock %}

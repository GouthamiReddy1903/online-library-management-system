{% extends "base.html" %}{% block title %}Login · Online Library{% endblock %}
{% block content %}<div class="form-card"><h1 class="h3 mb-3">Login</h1>
<form method="post"><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
<button class="btn btn-primary w-100">Login</button></form><p class="mt-3 mb-0">New student? <a href="{{ url_for('register') }}">Register here</a></p></div>{% endblock %}

{% extends "base.html" %}{% block title %}Student Registration{% endblock %}
{% block content %}<div class="form-card"><h1 class="h3 mb-3">Student Registration</h1>
<form method="post"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="name" required></div>
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Password (minimum 6 characters)</label><input class="form-control" type="password" name="password" minlength="6" required></div>
<button class="btn btn-primary w-100">Create Account</button></form></div>{% endblock %}
